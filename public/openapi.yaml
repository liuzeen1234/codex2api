openapi: 3.1.0
info:
  title: Codex2API
  version: 0.1.0
  description: 将本机 Codex CLI 包装为文生文、文生图、图生图和图生文 API。
servers:
  - url: http://localhost:3010
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: 服务健康检查
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
  /v1/models:
    get:
      summary: 获取模型列表
      responses:
        '200':
          description: 模型列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, const: list }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Model' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/chat/completions:
    post:
      summary: 文生文
      description: stream=true 时返回 SSE；Codex 完成回答后由服务增量发送，最后发送 data: [DONE]。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: JSON 或 SSE 响应
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
  /v1/responses:
    post:
      summary: Responses 文本接口
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                model: { type: string, default: codex }
                input:
                  oneOf:
                    - { type: string }
                    - type: array
                      items: { $ref: '#/components/schemas/Message' }
      responses:
        '200':
          description: 已完成的响应
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResponseObject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
  /v1/images/generations:
    post:
      summary: 文生图
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImageGenerationRequest' }
      responses:
        '200':
          description: 图片结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
  /v1/images/edits:
    post:
      summary: 图生图
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, prompt]
              properties:
                image:
                  type: array
                  maxItems: 10
                  items: { type: string, format: binary }
                mask: { type: string, format: binary }
                prompt: { type: string }
                model: { type: string, default: codex }
                n: { type: integer, minimum: 1, default: 1 }
                size: { type: string, default: 1024x1024 }
                response_format: { $ref: '#/components/schemas/ImageResponseFormat' }
      responses:
        '200':
          description: 编辑后的图片
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
  /v1/images/analyze:
    post:
      summary: 图生文／图像理解
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, format: binary }
                prompt: { type: string, default: 请详细描述图片中的内容。 }
                model: { type: string, default: codex }
      responses:
        '200':
          description: 图片分析结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImageAnalysisResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: 仅当服务端配置 API_KEY 时需要。
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: API Key 无效
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServerError:
      description: Codex 或服务内部错误
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    Model:
      type: object
      properties:
        id: { type: string }
        object: { type: string, const: model }
        created: { type: integer }
        owned_by: { type: string }
    Message:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, developer, user, assistant, tool] }
        content:
          oneOf:
            - { type: string }
            - type: array
              items: { type: object, additionalProperties: true }
    ChatRequest:
      type: object
      required: [messages]
      properties:
        model: { type: string, default: codex }
        messages:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/Message' }
        stream: { type: boolean, default: false }
    ChatResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string, const: chat.completion }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message: { $ref: '#/components/schemas/Message' }
              finish_reason: { type: string }
        usage: { type: ['object', 'null'] }
    ResponseObject:
      type: object
      properties:
        id: { type: string }
        object: { type: string, const: response }
        created_at: { type: integer }
        status: { type: string, const: completed }
        model: { type: string }
        output: { type: array, items: { type: object, additionalProperties: true } }
        output_text: { type: string }
        usage: { type: ['object', 'null'] }
    ImageResponseFormat:
      type: string
      enum: [url, b64_json]
      default: url
    ImageGenerationRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        model: { type: string, default: codex }
        n: { type: integer, minimum: 1, default: 1 }
        size: { type: string, default: 1024x1024 }
        response_format: { $ref: '#/components/schemas/ImageResponseFormat' }
    ImageResponse:
      type: object
      properties:
        created: { type: integer }
        data:
          type: array
          items:
            type: object
            properties:
              url: { type: string, format: uri }
              b64_json: { type: string, contentEncoding: base64 }
              revised_prompt: { type: string }
    ImageAnalysisResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string, const: image.analysis }
        created: { type: integer }
        model: { type: string }
        text: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              text: { type: string }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
            type: { type: string }
            param: { type: ['string', 'null'] }
            code: { type: ['string', 'null'] }
